<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

.contact a { color: #E8C97A; text-decoration: none; border-bottom: 1px solid rgba(232,201,122,0.35); }
.contact a:hover { border-bottom-color: #E8C97A; }
